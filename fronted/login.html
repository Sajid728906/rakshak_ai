<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakshak AI | Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="background"></div>

<div class="login-box">

<div class="logo">
🛡️
<h2>Rakshak AI</h2>
<p>AI Powered Scam Protection</p>
</div>

<form id="loginForm">

<div class="input-box">

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<input
type="password"
id="password"
placeholder="Password"
required>

<span id="togglePassword">👁</span>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="forgot-password.html">

Forgot Password?

</a>

</div>

<button type="submit">

Login

</button>

<div class="bottom">

Don't have an account?

<a href="signup.html">

Signup

</a>

</div>

</form>

</div>

<script src="js/login.js"></script>

</body>
</html>
