<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rakshak AI | Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="background"></div>

<div class="login-box">

<div class="logo">

🛡️

<h2>Create Account</h2>

<p>Join Rakshak AI</p>

</div>

<form id="signupForm">

<div class="input-box">

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

</div>

<div class="input-box">

<input
type="password"
id="password"
placeholder="Password"
required>

<span id="togglePassword">👁</span>

</div>

<div class="input-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<span id="toggleConfirm">👁</span>

</div>

<div id="strength"></div>

<label class="terms">

<input
type="checkbox"
required>

I Agree to the Terms & Conditions

</label>

<button type="submit">

Create Account

</button>

<div class="bottom">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</form>

</div>

<script src="js/signup.js"></script>

</body>

</html>
